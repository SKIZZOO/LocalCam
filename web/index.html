<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalCam</title><link rel="stylesheet" href="/app.css"></head><body><aside><div class="brand"><span>●</span> LocalCam</div><nav><button class="active" data-page="dashboard">Dashboard</button><button data-page="archive">Arhivă</button><button data-page="settings">Setări</button></nav><div class="side-foot">NVR local • LAN</div></aside><main><header><div><h1 id="title">Dashboard</h1><div class="muted" id="clock"></div></div><div class="actions"><span id="storage"></span><button onclick="refresh()">Reîmprospătare</button></div></header><section id="dashboard" class="page active"><div id="grid" class="grid"></div></section><section id="archive" class="page"><div class="panel"><div class="row"><input id="search" placeholder="Caută înregistrare..."><button onclick="loadArchive()">Caută</button></div><div id="archiveList"></div></div></section><section id="settings" class="page"><div class="panel"><h2>Setări locale</h2><div class="formgrid"><label>Folder înregistrări<input id="record_root"></label><label>Port web<input id="web_port" type="number"></label><label>FFmpeg<input id="ffmpeg_path" placeholder="ffmpeg sau C:/ffmpeg/bin/ffmpeg.exe"></label><label>Mod înregistrare<select id="record_mode"><option value="continuous">Continuu 24/7</option><option value="motion">La mișcare</option></select></label><label>Segment (minute)<input id="segment_minutes" type="number"></label><label>Retenție (zile)<input id="retention_days" type="number"></label><label>Min. spațiu liber (GB)<input id="min_free_gb" type="number"></label><label>Detecție mișcare<select id="motion_enabled"><option value="1">Activată</option><option value="0">Dezactivată</option></select></label><label>Prag mișcare<input id="motion_threshold" type="number" step="0.5"></label><label>Fracție modificată<input id="motion_fraction" type="number" step="0.001"></label><label>Cooldown (secunde)<input id="motion_cooldown" type="number"></label></div><h3>Camere</h3><div id="cams"></div><button class="primary" onclick="saveSettings()">Salvează</button></div></section></main><script src="/app.js"></script></body></html>
